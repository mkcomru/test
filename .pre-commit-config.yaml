repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: scripts/manual_testing
      - id: ruff-format
        exclude: scripts/manual_testing

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--baseline"
          - ".secrets.baseline"
          - "--exclude-files"
          - "(node_modules|\\.ruff_cache|\\.venv|uv\\.lock|scripts/manual_testing)"
        exclude: "(?x)(^(.*/)?migrations/|\\.env\\.test|\\.env\\.shared\\.example|apps/bitrix-module/settings\\.example\\.json|apps/bitrix-module/README\\.md|^scripts/manual_testing/|^docs/configuration\\.md)"
