services:
  test-psg:
    image: postgres:18
    container_name: test-psg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: transfers
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transfers"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: test-api
    env_file: .env
    environment:
      DATABASE__HOST: test-psg
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      test-psg:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: